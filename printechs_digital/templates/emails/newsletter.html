<table role="presentation" align="center" width="800" cellpadding="0" cellspacing="0" border="0" style="width:800px;max-width:800px;margin:0 auto;">
	<tr>
		<td width="800" valign="top" style="width:800px;">
			{{ message }}
		</td>
	</tr>
</table>

{% if published and send_webview_link %}
<div style="font-size:12px;line-height:20px;text-align:center;padding:8px 0;">
	<a style="color:#687178;text-decoration:underline;" href="/newsletters/{{ name }}" target="_blank">View this email in a browser</a>
</div>
{% endif %}
